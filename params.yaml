# Hiperparâmetros do modelo. Mudou aqui? O CI treina de novo e confere os limiares.
semente: 42

modelo:
  C: 0.00005
  max_iter: 1000
  # HTRU2 é desbalanceado (~9% pulsares). "balanced" pesa a classe pulsar ~10x mais,
  # o que sobe o recall (~0,93 no holdout) sem derrubar demais a precisão (~0,81).
  # Sem pesos o recall fica em ~0,82 (abaixo do contrato de 0,85).
  class_weight: balanced
